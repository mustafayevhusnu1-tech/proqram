name: iOS build
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          flutter create --platforms=ios .
          flutter pub get
          plutil -insert NSPhotoLibraryAddUsageDescription -string "Videoları qalereyaya saxlamaq üçün icazə lazımdır." ios/Runner/Info.plist || true
          plutil -insert NSPhotoLibraryUsageDescription -string "Qalereyaya daxil olmaq üçün icazə lazımdır." ios/Runner/Info.plist || true
      - run: flutter build ios --release --no-codesign
      - run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r app.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: app.ipa
